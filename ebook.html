<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050f1f">
<title>SeaCrates Ebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@600;700;800;900&display=swap">
<style>
/* Layout: one dark ocean room, a 3D flip book centered; two-page spread on desktop, single page on phones. */
:root {
  --abyss: #050f1f;
  --navy: #0b2545;
  --teal: #13a89e;
  --teal-deep: #0d7d76;
  --gold: #f2b84b;
  --coral: #ff6b5b;
  --sand: #f6efe0;
  --sand-2: #ece1c8;
  --ink: #14233b;
  --ink-soft: #4a5b73;
  --line: rgba(20, 35, 59, .16);
  --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
  --flip: 1s;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background:
    radial-gradient(70% 50% at 50% 0%, rgba(19, 168, 158, .22), transparent 70%),
    radial-gradient(60% 40% at 85% 100%, rgba(242, 184, 75, .08), transparent 70%),
    linear-gradient(180deg, #0b2545 0%, #061428 55%, #050f1f 100%);
  background-color: var(--abyss);
  color: #dbe7f3;
  font-family: var(--font-body);
  padding-inline: 16px;
  padding-block: 14px 18px;
  overflow-x: hidden;
}
.room { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.top { width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; font-size: 14px; color: var(--gold); text-transform: uppercase; }
.brand small { font-family: var(--font-body); font-weight: 400; letter-spacing: .04em; text-transform: none; color: #8fa6bd; margin-left: 10px; font-size: 12px; }
.pill {
  appearance: none; border: 1px solid rgba(242, 184, 75, .45); background: rgba(5, 15, 31, .55); color: #f3dba4;
  font: 500 13px/1 var(--font-body); padding: 9px 14px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: background .2s, border-color .2s;
}
.pill:hover { background: rgba(242, 184, 75, .14); border-color: var(--gold); }
.pill:focus-visible, .nav:focus-visible, .go:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.pill svg { width: 16px; height: 16px; }

.stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; padding-block: 6px; }
.scaler { position: relative; margin-inline: auto; flex: none; }
.scaler.single { overflow: hidden; }
.stage { min-width: 0; }
.shift { transition: transform var(--flip) cubic-bezier(.6, .05, .25, 1); }
.book { position: relative; z-index: 1; transform-origin: 0 0; perspective: 3000px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.floor { position: absolute; z-index: 0; left: 4%; right: 4%; bottom: -26px; height: 40px; background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .55), transparent 70%); filter: blur(6px); pointer-events: none; }

.leaf {
  position: absolute; top: 0; width: var(--W, 420px); height: var(--H, 590px); transform-origin: 0 50%;
  transform-style: preserve-3d; transition: transform var(--flip) cubic-bezier(.55, .08, .2, 1);
}
.leaf.flipped { transform: rotateY(-180deg); }
.book.single .leaf.flipped { visibility: hidden; transition: transform var(--flip) cubic-bezier(.55, .08, .2, 1), visibility 0s linear var(--flip); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
}
.face.front { transform: translateZ(1px); }
.face.back { transform: rotateY(180deg) translateZ(1px); }
.face.front { border-radius: 2px 7px 7px 2px; }
.face.back { border-radius: 7px 2px 2px 7px; }
.face::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.face.front::after { background: linear-gradient(90deg, rgba(0, 0, 0, .30), rgba(0, 0, 0, .06) 5%, transparent 12%), linear-gradient(270deg, rgba(0, 0, 0, .08), transparent 3%); }
.face.back::after { background: linear-gradient(270deg, rgba(0, 0, 0, .30), rgba(0, 0, 0, .06) 5%, transparent 12%), linear-gradient(90deg, rgba(0, 0, 0, .08), transparent 3%); }
.face.empty { background: transparent; }
.face.empty::after { display: none; }

/* paper pages */
.paper {
  background:
    radial-gradient(120% 80% at 20% 0%, rgba(255, 255, 255, .55), transparent 60%),
    linear-gradient(180deg, var(--sand), var(--sand-2));
  color: var(--ink);
  font: 400 13.5px/1.72 var(--font-body);
}
.scroll { position: absolute; inset: 0 0 42px 0; padding: 38px 34px 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(20, 35, 59, .25) transparent; }
.paper .inner { position: relative; }
.eyebrow { font: 600 10.5px/1 var(--font-body); letter-spacing: .2em; text-transform: uppercase; color: var(--teal-deep); margin: 0 0 12px; }
.paper h2 { font: 700 24px/1.4 var(--font-display); margin: 0 0 14px; color: var(--navy); text-wrap: balance; }
.paper h3 { font: 700 16px/1.5 var(--font-display); margin: 22px 0 8px; color: var(--navy); }
.paper p { margin: 0 0 10px; text-wrap: pretty; }
.paper p.lead { font-size: 14px; color: var(--ink); border-left: 3px solid var(--gold); padding-left: 12px; margin-bottom: 14px; }
.paper ul, .paper ol { margin: 0 0 10px; padding-left: 18px; }
.paper li { margin-bottom: 6px; padding-left: 2px; }
.paper li::marker { color: var(--teal); }
.pfoot { position: absolute; left: 34px; right: 34px; bottom: 18px; display: flex; justify-content: space-between; font: 500 10px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); pointer-events: none; z-index: 2; }
.paper::-webkit-scrollbar { width: 5px; }
.paper::-webkit-scrollbar-thumb { background: rgba(20, 35, 59, .25); border-radius: 4px; }

.rows { margin: 4px 0 8px; }
.row { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.row:first-child { border-top: 1px solid var(--line); }
.row b { font: 600 12px/1.45 var(--font-body); color: var(--teal-deep); }
.row span { min-width: 0; }
.case { padding: 12px 0 8px; border-bottom: 1px solid var(--line); }
.case:first-of-type { border-top: 1px solid var(--line); }
.case h4 { margin: 0 0 8px; font: 700 15px/1.5 var(--font-display); color: var(--navy); }
.case p { margin: 0 0 8px; }
.case .tag { display: inline-block; font: 600 10px/1.5 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--navy); background: rgba(11, 37, 69, .10); padding: 1px 7px; border-radius: 3px; margin-right: 8px; }
.case .tag.ok { color: #0a5f59; background: rgba(19, 168, 158, .18); }
.idea { padding: 10px 0; border-bottom: 1px solid var(--line); }
.idea:first-of-type { border-top: 1px solid var(--line); }
.idea b { display: block; font: 700 15px/1.5 var(--font-display); color: var(--navy); margin-bottom: 3px; }
.idea em { display: block; font-style: normal; font-size: 12.5px; color: #0a5f59; margin-top: 4px; }
ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 4px 0 8px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
ol.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: var(--gold); font: 600 12px/24px var(--font-body); text-align: center; }
.toc { list-style: none; padding: 0; margin: 6px 0 0; }
.toc li { margin: 0; padding: 0; }
.go { appearance: none; background: none; border: 0; border-bottom: 1px dotted rgba(20, 35, 59, .35); width: 100%; display: flex; gap: 10px; align-items: baseline; text-align: left; padding: 8px 0; color: var(--ink); font: 500 13px/1.4 var(--font-body); cursor: pointer; }
.go:hover { color: var(--teal-deep); }
.go i { font-style: normal; margin-left: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.quote { font: italic 600 17px/1.5 var(--font-display); color: var(--navy); border-top: 2px solid var(--gold); padding-top: 14px; margin-top: 18px; text-wrap: balance; }
.note { font-size: 11.5px; color: var(--ink-soft); }
.todo { background: rgba(242, 184, 75, .25); padding: 1px 5px; border-radius: 3px; }

/* covers */
.cover { background: var(--abyss); color: #eaf3fb; }
.cover .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cover .ctext { position: absolute; left: 34px; right: 34px; top: 46px; z-index: 2; }
.cover .ceye { font: 600 10.5px/1.4 var(--font-body); letter-spacing: .26em; text-transform: uppercase; color: var(--gold); margin: 0 0 16px; }
.cover h1 { font: 800 32px/1.3 var(--font-display); margin: 0; color: #fff; text-wrap: balance; }
.cover h1 em { font-style: italic; font-weight: 700; color: var(--gold); }
.cover .csub { margin: 14px 0 0; font: 400 13px/1.7 var(--font-body); color: #c6d8e8; max-width: 290px; }
.cover .cfoot { position: absolute; left: 34px; right: 34px; bottom: 26px; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.cover .cfoot b { display: block; font: 600 13px/1.3 var(--font-body); color: #fff; }
.cover .cfoot span { font: 400 11px/1.4 var(--font-body); color: #9db6cc; }
.cover .mark { font: 700 11px/1 var(--font-display); letter-spacing: .24em; color: var(--gold); border: 1px solid rgba(242, 184, 75, .6); padding: 8px 10px; white-space: nowrap; }
.cover .frame { position: absolute; inset: 12px; border: 1px solid rgba(242, 184, 75, .35); border-radius: 3px; z-index: 1; pointer-events: none; }
.bub { position: absolute; bottom: -20px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .5); background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .5), rgba(255, 255, 255, .05) 60%); z-index: 1; animation: rise 9s linear infinite; }
@keyframes rise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 12% { opacity: .9; } 100% { transform: translateY(-640px) translateX(18px); opacity: 0; } }
.back-cover .ctext { top: auto; bottom: 150px; text-align: center; }
.back-cover .ctext h1 { font-size: 28px; }
.back-cover .csub { margin-inline: auto; }

/* covers: nautical chart */
.cover { background: #06162b; color: #eaf3fb; }
.cv-map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cv-grain { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: .38; pointer-events: none; z-index: 3; }
.cv-box { position: absolute; z-index: 2; box-sizing: border-box; background: rgba(5, 19, 38, .93); border: 1px solid rgba(242, 184, 75, .75); outline: 1px solid rgba(242, 184, 75, .22); outline-offset: 3px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.cv-eye { margin: 0 0 14px; font: 600 10px/1.6 var(--font-body); letter-spacing: .28em; text-transform: uppercase; color: #8fd3d3; }
.foil { background: linear-gradient(100deg, #b8862c 0%, #f6da8c 26%, #f2b84b 46%, #fff0bd 58%, #c8952f 82%, #e9bf62 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.cv-box h1 { margin: 0; font: 800 29px/1.38 var(--font-display); text-wrap: balance; }
.cv-rule { width: 56px; height: 1px; background: linear-gradient(90deg, #f2b84b, rgba(242, 184, 75, 0)); margin: 16px 0 14px; }
.cv-sub { margin: 0; max-width: 270px; font: 400 12.5px/1.75 var(--font-body); color: #c3d6e6; }
.cv-id { display: flex; flex-direction: column; gap: 5px; }
.cv-id b { font: 800 15px/1.4 var(--font-display); letter-spacing: .2em; }
.cv-id span { font: 400 10.5px/1.5 var(--font-body); letter-spacing: .04em; color: #a9c1d6; }
.lg { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(242, 184, 75, .18); font: 400 12px/1.5 var(--font-body); color: #d6e5f1; }
.lg svg { width: 28px; height: 18px; display: block; }

.ph-front { background-position: 82% 0; }
.ph-back { background-position: 0 0; transform: scaleX(-1); filter: saturate(.9) brightness(.8); }
.ph-shade { position: absolute; inset: 0; }
.ph-shade-front { background: linear-gradient(180deg, rgba(3, 12, 26, .94) 0, rgba(3, 12, 26, .72) 20%, rgba(3, 12, 26, 0) 40%, rgba(3, 12, 26, 0) 62%, rgba(3, 12, 26, .8) 83%, rgba(3, 12, 26, .97) 100%); }
.ph-shade-back { background: radial-gradient(70% 38% at 85% 0%, rgba(31, 120, 190, .38), transparent 70%), linear-gradient(180deg, rgba(3, 12, 26, .35), rgba(3, 12, 26, .85)); }
.ph-lines { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ph-front + .ph-shade + .ph-lines, .ph-shade-front + .ph-lines { -webkit-mask-image: linear-gradient(180deg, #000 0, #000 12%, transparent 30%, transparent 80%, #000 96%); mask-image: linear-gradient(180deg, #000 0, #000 12%, transparent 30%, transparent 80%, #000 96%); }
.ph-frame { position: absolute; inset: 14px; border: 1px solid rgba(242, 184, 75, .7); z-index: 4; pointer-events: none; }
.ph-frame::after { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(242, 184, 75, .25); }
.ph-top { position: absolute; z-index: 2; left: 38px; right: 38px; top: 44px; }
.ph-top .cv-eye { margin-bottom: 12px; }
.ph-top h1 { margin: 0; font: 800 31px/1.4 var(--font-display); }
.ph-top .cv-rule { margin: 14px 0 0; }
.ph-bottom { position: absolute; z-index: 2; left: 38px; right: 38px; bottom: 40px; display: flex; flex-direction: column; gap: 16px; }
.ph-bottom .cv-sub { max-width: 280px; }
.ph-bottom-c { align-items: center; text-align: center; }
.ph-id { display: flex; flex-direction: column; gap: 5px; }
.ph-id b { font: 800 15px/1.4 var(--font-display); letter-spacing: .22em; }

.ph-shade-back2 { background: linear-gradient(180deg, rgba(3, 12, 26, .45) 0, rgba(3, 12, 26, 0) 22%, rgba(3, 12, 26, 0) 55%, rgba(3, 12, 26, .72) 78%, rgba(3, 12, 26, .95) 100%); }
.bk-mark { position: absolute; z-index: 2; left: 38px; right: 38px; bottom: 58px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.bk-mark b { font: 800 22px/1.4 var(--font-display); letter-spacing: .32em; padding-left: .32em; }
.bk-mark i { width: 44px; height: 1px; background: linear-gradient(90deg, rgba(242, 184, 75, 0), #f2b84b, rgba(242, 184, 75, 0)); }
.bk-mark span { font: italic 500 15px/1.6 var(--font-display); color: #d3e5f3; letter-spacing: .02em; }
/* legend inside the contents page */
.legend { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
.legend .eyebrow { margin-bottom: 8px; }
.legend-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.lgd { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 8px; font: 400 11.5px/1.45 var(--font-body); color: var(--ink); }
.lgd svg { width: 26px; height: 16px; display: block; }


/* ===== Mobile: một trang vừa khít màn hình, chữ không bị thu nhỏ ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.book.single .paper { font-size: 16px; line-height: 1.75; }
.book.single .scroll { padding: 28px 22px 10px; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.book.single .scroll::after { content: ""; display: block; height: 14px; }
.book.single .eyebrow { font-size: 11.5px; }
.book.single .paper h2 { font-size: 27px; line-height: 1.35; }
.book.single .paper h3 { font-size: 19px; }
.book.single .paper p.lead { font-size: 17px; }
.book.single .row { grid-template-columns: 1fr; gap: 3px; padding: 11px 0; }
.book.single .row b { font-size: 13.5px; }
.book.single .case h4, .book.single .idea b { font-size: 17px; }
.book.single .idea em, .book.single .note { font-size: 13.5px; }
.book.single ol.steps li { grid-template-columns: 30px minmax(0, 1fr); font-size: 16px; }
.book.single .go { font-size: 16px; padding: 12px 0; }
.book.single .lgd { font-size: 13px; }
.book.single .legend-grid { grid-template-columns: 1fr; }
.book.single .quote { font-size: 19px; }
.book.single .pfoot { left: 22px; right: 22px; font-size: 11px; }
.book.single .cover .ph-top { left: 30px; right: 30px; }
.book.single .ph-bottom { left: 30px; right: 30px; }
.book.single .ph-top h1 { font-size: 29px; }
.book.single .cv-sub { font-size: 14px; max-width: none; }
.book.single .cv-eye { font-size: 11px; }
.hint { padding-inline: 8px; }


/* ===== Phone mode: không dùng 3D (iOS Safari lỗi), font hệ thống ===== */
body.phone {
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", "Times New Roman", serif;
}
body.phone { -webkit-font-smoothing: antialiased; }
.book.single { perspective: none; -webkit-perspective: none; }
.book.single .leaf {
  display: none; transform: none !important; -webkit-transform: none !important;
  transform-style: flat; -webkit-transform-style: flat; transition: none; visibility: visible !important;
}
.book.single .leaf.cur { display: block; animation: pgin .28s ease-out; }
.book.single .face { backface-visibility: visible; -webkit-backface-visibility: visible; transform: none !important; border-radius: 6px; }
.book.single .face.back { display: none; }
.book.single .cv-grain { display: none; }
.book.single .face::after { background: linear-gradient(90deg, rgba(0,0,0,.14), transparent 4%); }
.book.single .ph-lines { display: none; }
@keyframes pgin { from { opacity: .2; transform: translateX(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .book.single .leaf.cur { animation: none; } }

/* controls */
.controls { width: 100%; max-width: 560px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; }
.nav { appearance: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(242, 184, 75, .5); background: rgba(5, 15, 31, .6); color: var(--gold); cursor: pointer; display: grid; place-items: center; transition: background .2s, opacity .2s; }
.nav:hover:not(:disabled) { background: rgba(242, 184, 75, .16); }
.nav:disabled { opacity: .3; cursor: default; }
.nav svg { width: 20px; height: 20px; }
.meter { text-align: center; min-width: 0; }
.meter b { display: block; font: 600 13px/1.2 var(--font-body); color: #f3dba4; letter-spacing: .04em; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width .5s ease; }
.hint { margin: 0; font-size: 12px; color: #7f97ae; text-align: center; text-wrap: balance; }
@media (max-width: 760px) {
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  :root { --flip: .01s; }
  .bub { animation: none; display: none; }
  .bar i { transition: none; }
}

/* ===== Phone polish: chữ rõ, khung gọn, ít trang trí gây rối mắt ===== */
body.phone { padding-inline: 8px; padding-block: 8px 10px; margin: 0; box-sizing: border-box; }
body.phone .room { gap: 8px; }
body.phone .top { max-width: 560px; }
body.phone .brand { font-size: 13px; letter-spacing: .1em; }
body.phone .brand small { display: none; }
body.phone .pill { font-size: 12.5px; padding: 8px 12px; min-height: 36px; }
body.phone .stage { padding-block: 0; }
body.phone .floor { display: none; }
/* font: một họ sans duy nhất cho tiêu đề + nội dung (dấu tiếng Việt rõ, không lẫn font dự phòng) */
body.phone .paper h2, body.phone .paper h3, body.phone .case h4, body.phone .idea b,
body.phone .quote, body.phone .cover h1, body.phone .cv-box h1, body.phone .ph-top h1,
body.phone .bk-mark b, body.phone .bk-mark span, body.phone .cv-id b, body.phone .ph-id b, body.phone .cover .mark {
  font-family: var(--font-body);
}
body.phone .paper h2 { font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: 0; }
body.phone .paper h3 { font-size: 18px; line-height: 1.4; font-weight: 700; margin-top: 20px; }
body.phone .case h4, body.phone .idea b { font-size: 16.5px; line-height: 1.45; font-weight: 700; }
body.phone .quote { font-style: normal; font-weight: 600; font-size: 17.5px; line-height: 1.55; }
body.phone .eyebrow, body.phone .cv-eye, body.phone .cover .ceye { letter-spacing: .08em; font-weight: 700; }
body.phone .pfoot { letter-spacing: .06em; }
body.phone .case .tag { letter-spacing: .04em; }
/* trang giấy: nền phẳng, đọc dễ hơn */
.book.single .paper { background: #f8f2e4; font-size: 16px; line-height: 1.7; hyphens: manual; overflow-wrap: break-word; }
.book.single .face { border-radius: 10px; box-shadow: 0 6px 22px rgba(0,0,0,.35); }
.book.single .face::after { display: none; }
.book.single .scroll { padding: 22px 20px 6px; inset: 0 0 34px 0; }
.book.single .paper p { margin-bottom: 12px; }
.book.single .paper p.lead { font-size: 16.5px; line-height: 1.65; }
.book.single .paper li { margin-bottom: 8px; }
.book.single .pfoot { bottom: 12px; left: 20px; right: 20px; font-size: 10.5px; }
/* bìa: bỏ khung đôi + hạt nhiễu, chữ gọn lại */
.book.single .ph-frame { inset: 10px; border-color: rgba(242,184,75,.45); }
.book.single .ph-frame::after { display: none; }
.book.single .cover .frame { display: none; }
.book.single .cover .ph-top { top: 30px; left: 26px; right: 26px; }
.book.single .cover .ph-bottom { bottom: 28px; left: 26px; right: 26px; gap: 12px; }
.book.single .ph-top h1, .book.single .cv-box h1 { font-size: clamp(24px, 7.4vw, 30px); line-height: 1.3; font-weight: 800; }
.book.single .cv-sub { font-size: 14px; line-height: 1.65; }
.book.single .bk-mark { bottom: 40px; }
.book.single .bk-mark b { font-size: 20px; letter-spacing: .2em; padding-left: .2em; }
.book.single .bk-mark span { font-size: 14.5px; font-style: normal; }
body.phone .hint { font-size: 12.5px; color: #9db3c8; line-height: 1.4; }
body.phone .controls { gap: 10px; max-width: 560px; }
body.phone .nav { width: 44px; height: 44px; }
</style>

<section>
  <p class="eyebrow">Phần mở đầu</p>
  <h2>Lời giới thiệu</h2>
  <p class="lead">SeaCrates đưa du khách xuống đáy biển để tìm kho báu trong những xác tàu đã trở thành rạn san hô nhân tạo.</p>
  <p>Mỗi chuyến đi vừa là một cuộc phiêu lưu, vừa góp phần bảo tồn hệ sinh thái biển. Ebook này giới thiệu ý tưởng, cách vận hành và chiến lược marketing của SeaCrates.</p>
  <h3>Mục đích biên soạn</h3>
  <ul>
    <li>Trình bày rõ sản phẩm tour săn kho báu SeaCrates và giá trị mà sản phẩm mang lại.</li>
    <li>Phân tích đặc điểm sản phẩm, cùng các thách thức và giải pháp: an toàn, thời tiết, môi trường, bảo trì.</li>
    <li>Áp dụng mô hình marketing dịch vụ 7Ps vào sản phẩm.</li>
    <li>Đề xuất ý tưởng cải tiến để SeaCrates phát triển bền vững.</li>
  </ul>
</section>

<section>
  <h3 style="margin-top:0">Đối tượng độc giả</h3>
  <ul>

    <li>Đối tác, nhà đầu tư, đơn vị lữ hành và các kênh truyền thông (KOC, KOL) muốn hợp tác với SeaCrates.</li>
    <li>Sinh viên và giảng viên ngành du lịch, marketing quan tâm đến mô hình tour bảo tồn kết hợp trải nghiệm.</li>

<section>
  <p class="eyebrow">Chương 1</p>
  <h2>Tổng quan SeaCrates</h2>
  <p class="lead">SeaCrates bán một trải nghiệm: lặn xuống xác tàu đắm, săn rương kho báu và rời đi với cảm giác đã góp phần bảo vệ biển.</p>
  <h3>Ý tưởng cốt lõi</h3>
  <p>Các xác tàu bỏ hoang được tận dụng làm rạn san hô nhân tạo để bảo tồn. San hô và sinh vật biển bám vào thân tàu, tạo nên điểm lặn đẹp mà không cần khai thác thêm rạn tự nhiên. SeaCrates xây dựng tour lặn săn kho báu quanh những điểm này.</p>
  <h3>Sản phẩm chính</h3>
  <p><b>Tour Lặn Săn Kho Báu SeaCrates.</b> Khách lặn theo nhóm nhỏ, khám phá khu vực tàu đắm và tìm các bí mật, kho báu được giấu sẵn. Khi tìm đủ, khách nhận quà lưu niệm làm kỷ niệm.</p>
</section>

<section>
  <p class="eyebrow">Chương 1 · tiếp theo</p>
  <h2>Giá trị cho khách hàng</h2>
  <div class="rows">
    <div class="row"><b>Phiêu lưu</b><span>Trò chơi săn kho báu thật dưới nước, khác hẳn tour lặn ngắm cảnh thông thường.</span></div>
    <div class="row"><b>Độc đáo</b><span>Điểm đến là xác tàu và rạn san hô nhân tạo, ít sản phẩm tương tự.</span></div>
    <div class="row"><b>Có ý nghĩa</b><span>Chuyến đi gắn với bảo tồn san hô, phù hợp khách quan tâm du lịch có trách nhiệm.</span></div>
    <div class="row"><b>An toàn</b><span>Nhóm nhỏ 2–3 người, có liên lạc và giới hạn khu vực lặn.</span></div>
    <div class="row"><b>Kỷ niệm</b><span>Quà lưu niệm chỉ nhận được khi hoàn thành thử thách.</span></div>
  </div>
</section>

<section>
  <p class="eyebrow">Chương 2</p>
  <h2>Khách hàng mục tiêu</h2>
  <p class="lead">SeaCrates nhắm đến du khách từ 20–40 tuổi, có thu nhập cao, đến từ khắp thế giới.</p>
  <h3>Chân dung khách hàng</h3>
  <div class="rows">
    <div class="row"><b>Độ tuổi</b><span>20–40</span></div>
    <div class="row"><b>Xuất phát</b><span>Mọi quốc gia, ưu tiên khách quốc tế.</span></div>
    <div class="row"><b>Thu nhập</b><span>Cao, sẵn sàng chi cho trải nghiệm độc đáo.</span></div>
    <div class="row"><b>Động cơ</b><span>Tìm cảm giác mới, khoe trải nghiệm trên mạng xã hội, ủng hộ bảo tồn.</span></div>
    <div class="row"><b>Kênh tiếp cận</b><span>Instagram, Threads, TikTok, Traveloka, website chính thức.</span></div>
  </div>

<section>
  <p class="eyebrow">Chương 2 · tiếp theo</p>
  <h2>Hành trình trải nghiệm</h2>
  <p class="note">Ví dụ minh họa một chuyến đi từ lúc biết đến SeaCrates đến lúc quay lại.</p>
  <ol class="steps">
    <li>Khách thấy video tour trên TikTok hoặc Instagram và vào website hoặc Traveloka.</li>
    <li>Khách đặt tour, chọn phương thức thanh toán và nhận xác nhận từ bộ phận chăm sóc khách hàng.</li>
    <li>Trước giờ lặn, khách ký cam kết miễn trừ trách nhiệm và nghe hướng dẫn an toàn.</li>
    <li>Nhóm 2–3 người lặn cùng hướng dẫn viên, liên lạc bằng bộ đàm, trong khu vực giới hạn.</li>
    <li>Khách tìm các bí mật, kho báu ở khu xác tàu.</li>
    <li>Tìm đủ kho báu thì nhận quà lưu niệm, chụp ảnh và chia sẻ lên mạng xã hội.</li>
    <li>Khách nhận ưu đãi dành cho khách quay lại.</li>
  </ol>
</section>

<section>
  <p class="eyebrow">Chương 3</p>
  <h2>Thách thức và giải pháp</h2>
  <p class="lead">Tour có bốn nhóm thách thức chính: an toàn, yếu tố tự nhiên, môi trường và bảo trì.</p>
  <div class="case">
    <h4>1. An toàn</h4>
    <p><span class="tag">Thách thức</span>Khách có thể bị kẹt trong tàu hoặc hết oxy khi lặn.</p>
    <p><span class="tag ok">Giải pháp</span>Mỗi nhóm 2–3 khách; có bộ đàm và micro liên lạc; thiết lập ranh giới an toàn để khách không bơi quá xa hoặc quá sâu; ký cam kết miễn trừ trách nhiệm.</p>
  </div>
  <div class="case">
    <h4>2. Yếu tố tự nhiên</h4>
